<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=5">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Add a friend on Vestigo.">
  <title>Add me on Vestigo</title>
  <link rel="icon" type="image/png" href="../vestigo-app-icon.png">
  <link rel="stylesheet" href="../assets/site.css">
  <meta name="appleid-signin-client-id" content="com.jojovestigo.web">
  <meta name="appleid-signin-scope" content="name">
  <meta name="appleid-signin-redirect-uri" content="https://vestigo-app.com/friend">
  <meta name="appleid-signin-use-popup" content="true">
  <style>
    main.card-page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      gap: 22px;
    }
    .glass.invite-card {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1.title { font-size: 26px; font-weight: 800; margin: 0; }
    .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 8px; }
    .divider { display: flex; align-items: center; gap: 10px; color: var(--text-tertiary); font-size: 13px; width: 100%; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--glass-stroke); }
    #apple-signin { display: flex; justify-content: center; }
    @media (max-width: 480px) {
      h1.title { font-size: 22px; }
    }
  </style>
</head>
<body>
  <nav class="tabs">
    <div class="tab-bar" role="tablist" aria-label="Vestigo site sections">
      <a class="tab-btn" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5A1 1 0 0 0 6.5 20.5h11a1 1 0 0 0 1-1V10"/></svg>
        <span class="label">Home</span>
      </a>
      <a class="tab-btn" href="/search/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
        <span class="label">Search</span>
      </a>
      <a class="tab-btn" href="/watchlist/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>
        <span class="label">Watchlist</span>
      </a>
      <a class="tab-btn" href="/collections/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="13" height="9" rx="2"/><path d="M7.5 17.5h13a2 2 0 0 0 2-2V8"/></svg>
        <span class="label">Collections</span>
      </a>
      <a class="tab-btn" href="/settings/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1.5 12h3M19.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        <span class="label">Settings</span>
      </a>
      <a class="tab-btn" href="/download/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11"/><path d="M8 10.5l4 4 4-4"/><path d="M4.5 17.5v2A1.5 1.5 0 0 0 6 21h12a1.5 1.5 0 0 0 1.5-1.5v-2"/></svg>
        <span class="label">Download</span>
      </a>
    </div>
  </nav>

  <main class="card-page">
    <img src="../vestigo-app-icon.png" alt="Vestigo" class="app-icon" width="1024" height="1024" style="width: 84px;">
    <div class="glass invite-card fade-in is-visible">
      <h1 class="title" id="heading">Add me on Vestigo</h1>
      <p class="sub" id="subtitle">No account needed — tap below and Vestigo will add you as a friend automatically.</p>

      <div class="actions">
        <button class="btn btn-primary btn-block" id="open-app-btn">Open in Vestigo</button>
        <div class="divider">or</div>
        <a class="btn btn-ghost btn-block" href="https://testflight.apple.com/join/zbvP2WEx" target="_blank" rel="noopener noreferrer">Get Vestigo on TestFlight</a>
      </div>

      <div class="divider">optional</div>
      <div id="apple-signin" data-color="white" data-border="true" data-type="continue"></div>
    </div>
  </main>

  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async></script>
  <script src="../assets/site.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const inviterName = params.get("name");
    if (inviterName) {
      document.getElementById("heading").textContent = `${inviterName} wants to add you on Vestigo`;
      document.getElementById("subtitle").textContent = "No account needed — tap below and you'll both be added as friends automatically.";
    }

    function deepLinkURL() {
      return "vestigo://friend" + window.location.search;
    }

    // Only fires on a tap — visiting this page should never force-launch the
    // app on its own. If the app is installed, iOS intercepts the original
    // universal link tap before this page even loads.
    document.getElementById("open-app-btn").addEventListener("click", () => {
      openInVestigoWithFallback(deepLinkURL());
    });

    initAppleSignIn({
      onIdentity: ({ givenName }) => {
        if (givenName) {
          document.getElementById("heading").textContent = `Welcome, ${givenName}`;
        }
        openInVestigoWithFallback(deepLinkURL());
      },
    });

    initFadeInOnScroll();
    initNavOffset();
    initNavActiveState();
  </script>
</body>
</html>
