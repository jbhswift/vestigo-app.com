<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=5">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Check this out on Vestigo.">
  <title>Vestigo</title>
  <link rel="icon" type="image/png" href="../vestigo-app-icon.png">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    main.detail-page { padding: 20px 0 60px; }

    .open-app-bar { margin-bottom: 22px; }

    .detail-header { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 22px; }
    .detail-poster {
      width: 110px;
      flex-shrink: 0;
      aspect-ratio: 2 / 3;
      border-radius: 18%;
      overflow: hidden;
      background: var(--glass-fill);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45);
    }
    .detail-poster img { width: 100%; height: 100%; object-fit: cover; }
    .detail-info { flex: 1; min-width: 0; padding-top: 2px; }
    .detail-info h1 { font-size: 22px; font-weight: 800; margin: 0 0 6px; line-height: 1.2; }
    .detail-meta { color: var(--text-secondary); font-size: 13.5px; line-height: 1.55; }

    .detail-overview { margin: 0 0 8px; font-size: 15px; line-height: 1.55; color: var(--text-secondary); }
    .imdb-link { display: inline-block; margin-bottom: 28px; font-size: 13px; font-weight: 700; color: var(--accent); }

    .cast-card { flex: 0 0 auto; width: 84px; text-align: center; }
    .cast-photo {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--glass-fill);
    }
    .cast-photo img { width: 100%; height: 100%; object-fit: cover; }
    .cast-name { margin-top: 8px; font-size: 11.5px; font-weight: 600; line-height: 1.3; }
    .cast-role { font-size: 10.5px; color: var(--text-tertiary); line-height: 1.3; }

    .trailer-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      background: var(--glass-fill);
    }
    .trailer-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

    .provider-list { display: flex; flex-direction: column; gap: 8px; }
    .provider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
    }
    .provider-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--glass-fill);
      flex-shrink: 0;
    }
    .provider-logo img { width: 100%; height: 100%; object-fit: cover; }
    .provider-name { font-size: 14px; font-weight: 600; }
    .provider-type { font-size: 12px; color: var(--text-tertiary); }

    .skeleton-line {
      height: 14px;
      border-radius: 7px;
      background: var(--glass-fill);
      margin-bottom: 8px;
    }

    @media (max-width: 480px) {
      .detail-poster { width: 92px; }
      .detail-info h1 { font-size: 19px; }
      .detail-meta { font-size: 12.5px; }
      .detail-overview { font-size: 14px; }
      .cast-card { width: 74px; }
      .cast-photo { width: 74px; height: 74px; }
    }
  </style>
</head>
<body>
  <nav class="tabs">
    <div class="tab-bar" role="tablist" aria-label="Vestigo site sections">
      <a class="tab-btn" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5A1 1 0 0 0 6.5 20.5h11a1 1 0 0 0 1-1V10"/></svg>
        <span class="label">Home</span>
      </a>
      <a class="tab-btn" href="/search/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
        <span class="label">Search</span>
      </a>
      <a class="tab-btn" href="/watchlist/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>
        <span class="label">Watchlist</span>
      </a>
      <a class="tab-btn" href="/collections/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="13" height="9" rx="2"/><path d="M7.5 17.5h13a2 2 0 0 0 2-2V8"/></svg>
        <span class="label">Collections</span>
      </a>
      <a class="tab-btn" href="/settings/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1.5 12h3M19.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        <span class="label">Settings</span>
      </a>
      <a class="tab-btn" href="/download/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11"/><path d="M8 10.5l4 4 4-4"/><path d="M4.5 17.5v2A1.5 1.5 0 0 0 6 21h12a1.5 1.5 0 0 0 1.5-1.5v-2"/></svg>
        <span class="label">Download</span>
      </a>
    </div>
  </nav>

  <main class="wrap detail-page">
    <div class="open-app-bar">
      <button class="btn btn-primary btn-block" id="open-app-btn">Open in Vestigo</button>
    </div>

    <div class="detail-header">
      <div class="detail-poster" id="poster"></div>
      <div class="detail-info">
        <h1 id="detail-title">Loading…</h1>
        <div class="detail-meta" id="detail-meta"></div>
      </div>
    </div>

    <p class="detail-overview" id="detail-overview"></p>
    <a class="imdb-link" id="imdb-link" href="#" target="_blank" rel="noopener noreferrer" style="display: none;">View on IMDb →</a>

    <div class="feature-group" id="cast-section" style="display: none;">
      <h2>Cast</h2>
      <div class="media-row" id="row-cast"></div>
    </div>

    <div class="feature-group" id="trailer-section" style="display: none;">
      <h2>Trailer</h2>
      <div class="trailer-wrap" id="trailer-wrap"></div>
    </div>

    <div class="feature-group" id="providers-section" style="display: none;">
      <h2>Where to watch</h2>
      <div class="provider-list glass" id="provider-list"></div>
    </div>

    <div class="feature-group" id="similar-section" style="display: none;">
      <h2>More like this</h2>
      <div class="media-row" id="row-similar"></div>
    </div>
  </main>

  <script src="../assets/site.js"></script>
  <script src="../assets/live-data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const kind = params.get("kind") === "tv" ? "tv" : "movie";

    function deepLinkURL() {
      return `vestigo://media?id=${encodeURIComponent(id ?? "")}&kind=${encodeURIComponent(kind)}`;
    }

    // Only fires on a tap — visiting this page should never force-launch the
    // app on its own. Tries the app, falls back to TestFlight automatically
    // if it doesn't open (see openInVestigoWithFallback in site.js).
    document.getElementById("open-app-btn").addEventListener("click", () => {
      openInVestigoWithFallback(deepLinkURL());
    });

    function regionGuess() {
      const parts = (navigator.language || "en-US").split("-");
      return (parts[1] || "US").toUpperCase();
    }

    function castCardHTML(person) {
      const photo = person.profile_path
        ? `<img src="https://image.tmdb.org/t/p/w185${person.profile_path}" alt="" loading="lazy">`
        : "";
      return `
        <div class="cast-card">
          <div class="cast-photo">${photo}</div>
          <div class="cast-name">${escapeHTML(person.name ?? "")}</div>
          <div class="cast-role">${escapeHTML(person.character ?? person.job ?? "")}</div>
        </div>
      `;
    }

    function pickTrailer(videos) {
      const results = videos?.results ?? [];
      const trailers = results.filter((v) => v.site === "YouTube" && v.type === "Trailer");
      return trailers.find((v) => v.official) ?? trailers[0] ?? results.find((v) => v.site === "YouTube") ?? null;
    }

    function providerRowHTML(provider, region) {
      const logo = provider.logo_path
        ? `<img src="https://image.tmdb.org/t/p/w154${provider.logo_path}" alt="" loading="lazy">`
        : "";
      return `
        <div class="provider-row">
          <div class="provider-logo">${logo}</div>
          <div>
            <div class="provider-name">${escapeHTML(provider.provider_name ?? "")}</div>
            <div class="provider-type">Streaming in ${region}</div>
          </div>
        </div>
      `;
    }

    async function loadDetail() {
      if (!id || !/^\d+$/.test(id)) {
        document.getElementById("detail-title").textContent = "Vestigo";
        return;
      }
      const region = regionGuess();
      try {
        const append = kind === "movie"
          ? "credits,videos,similar,recommendations,external_ids,release_dates,watch/providers"
          : "credits,videos,similar,recommendations,external_ids,content_ratings,watch/providers";
        const url = `${TMDB_BACKEND}/tmdb-proxy?path=${encodeURIComponent(`/${kind}/${id}`)}&append_to_response=${encodeURIComponent(append)}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        const title = data.title ?? data.name ?? "Untitled";
        document.title = `${title} — Vestigo`;
        document.getElementById("detail-title").textContent = title;

        const releaseDate = data.release_date ?? data.first_air_date ?? "";
        const year = releaseDate ? releaseDate.slice(0, 4) : null;
        const runtime = kind === "movie"
          ? (data.runtime ? `${data.runtime} min` : null)
          : (data.number_of_seasons ? `${data.number_of_seasons} season${data.number_of_seasons === 1 ? "" : "s"}` : null);
        const genres = (data.genres ?? []).slice(0, 3).map((g) => g.name);
        const rating = typeof data.vote_average === "number" && data.vote_average > 0 ? `★ ${data.vote_average.toFixed(1)}` : null;
        document.getElementById("detail-meta").textContent = [
          kind === "tv" ? "TV Series" : "Movie", year, runtime, ...genres, rating,
        ].filter(Boolean).join(" · ");

        if (data.poster_path) {
          document.getElementById("poster").innerHTML =
            `<img src="https://image.tmdb.org/t/p/w342${data.poster_path}" alt="${escapeHTML(title)}">`;
        }

        document.getElementById("detail-overview").textContent = data.overview ?? "";

        const imdbID = data.external_ids?.imdb_id;
        if (imdbID) {
          const link = document.getElementById("imdb-link");
          link.href = `https://www.imdb.com/title/${imdbID}/`;
          link.style.display = "inline-block";
        }

        const cast = (data.credits?.cast ?? []).slice(0, 15);
        if (cast.length) {
          document.getElementById("row-cast").innerHTML = cast.map(castCardHTML).join("");
          document.getElementById("cast-section").style.display = "";
        }

        const trailer = pickTrailer(data.videos);
        if (trailer) {
          document.getElementById("trailer-wrap").innerHTML =
            `<iframe src="https://www.youtube-nocookie.com/embed/${trailer.key}" title="Trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
          document.getElementById("trailer-section").style.display = "";
        }

        const providersByRegion = data["watch/providers"]?.results ?? {};
        const regionProviders = providersByRegion[region] ?? providersByRegion.US;
        if (regionProviders) {
          const seen = new Set();
          const combined = [
            ...(regionProviders.flatrate ?? []),
            ...(regionProviders.free ?? []),
            ...(regionProviders.ads ?? []),
          ].filter((p) => {
            if (seen.has(p.provider_id)) return false;
            seen.add(p.provider_id);
            return true;
          });
          if (combined.length) {
            document.getElementById("provider-list").innerHTML =
              combined.map((p) => providerRowHTML(p, regionProviders === providersByRegion.US ? "US" : region)).join("");
            document.getElementById("providers-section").style.display = "";
          }
        }

        const seenSimilar = new Set();
        const similar = [...(data.recommendations?.results ?? []), ...(data.similar?.results ?? [])]
          .filter((item) => {
            if (seenSimilar.has(item.id)) return false;
            seenSimilar.add(item.id);
            return true;
          })
          .slice(0, 12);
        if (similar.length) {
          document.getElementById("row-similar").innerHTML =
            similar.map((item) => mediaCardHTML(item, kind)).join("");
          document.getElementById("similar-section").style.display = "";
        }
      } catch (err) {
        console.warn("Couldn't load media details:", err);
        document.getElementById("detail-title").textContent = "Check this out on Vestigo";
      }
    }

    loadDetail();
    initNavOffset();
    initNavActiveState();
  </script>
</body>
</html>
